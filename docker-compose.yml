services:
  clickhouse:
    image: clickhouse/clickhouse-server:22.8.8
    restart: on-failure
    environment:
      - CLICKHOUSE_DB=signoz_traces
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=signoz123
      - CLICKHOUSE_ACCESS_MANAGEMENT=1
      - CREATE_METRICS_DB=true
      - CLICKHOUSE_INIT_SCRIPT=/docker-entrypoint-initdb.d/init.sql
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144

  signoz-frontend:
    image: signoz/frontend:0.34.1
    restart: on-failure
    depends_on:
      - signoz-query-service
    ports:
      - "3301:3301"

  signoz-query-service:
    image: signoz/query-service:0.34.1
    restart: on-failure
    depends_on:
      - clickhouse
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000/?database=signoz_traces&username=default&password=signoz123
      - STORAGE=clickhouse
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/data
      - SIGNOZ_FORCE_MIGRATION=true
      - JWT_SECRET_KEY=mysupersecretjwtkey
      - JWT_SECRET=mysupersecretjwtkey
      - SECRET_KEY=mysupersecretjwtkey
      - DISABLE_JWT_AUTH=true
    ports:
      - "8080:8080"
    volumes:
      - signoz-data:/var/lib/signoz
    extra_hosts:
      - "clickhouse:host-gateway"

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.88.5
    restart: on-failure
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - clickhouse

  mysql-monitor:
    image: prom/mysqld-exporter
    command:
      - '--config.my-cnf=/etc/mysql/.my.cnf'
    volumes:
      - ./.my.cnf:/etc/mysql/.my.cnf:ro
    ports:
      - "9104:9104"
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  clickhouse:
  signoz-data: 