name: Database CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mysql-connector-python python-dotenv psutil pandas matplotlib requests
    
    - name: Set up MySQL
      run: |
        # Set environment variable to avoid interactive prompts
        export DEBIAN_FRONTEND=noninteractive
        
        # Update package lists
        sudo apt-get update
        
        # Pre-set root password to avoid interactive prompts
        echo "mysql-server mysql-server/root_password password root_password" | sudo debconf-set-selections
        echo "mysql-server mysql-server/root_password_again password root_password" | sudo debconf-set-selections
        
        # Install MySQL
        sudo apt-get install -y mysql-client mysql-server
        
        # Start MySQL service
        sudo systemctl start mysql || sudo service mysql start
        
        # Wait for MySQL to start
        sleep 5
        
        # Set up database and permissions
        echo "Creating database and user..."
        sudo mysql -u root -proot_password -e "CREATE DATABASE IF NOT EXISTS project_db;"
        sudo mysql -u root -proot_password -e "CREATE USER IF NOT EXISTS 'test_user'@'localhost' IDENTIFIED BY 'test_password';"
        sudo mysql -u root -proot_password -e "GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'localhost';"
        sudo mysql -u root -proot_password -e "FLUSH PRIVILEGES;"
        
        # Verify user was created
        echo "Verifying user creation..."
        sudo mysql -u root -proot_password -e "SELECT User, Host FROM mysql.user WHERE User='test_user';"
    
    - name: Deploy initial schema
      run: |
        echo "Deploying initial schema..."
        sudo mysql -u test_user -ptest_password project_db < sql/01_initial_schema.sql
    
    - name: Deploy schema update
      run: |
        echo "Updating schema..."
        sudo mysql -u test_user -ptest_password project_db < sql/02_schema_update.sql
    
    - name: Seed sample data
      run: |
        echo "Seeding data..."
        sudo mysql -u test_user -ptest_password project_db < sql/03_sample_data.sql
    
    - name: Run concurrent queries
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: project_db
        CI: true
        GITHUB_ACTIONS: true
      run: |
        echo "Running concurrent queries..."
        python scripts/multi_thread_queries.py
    
    - name: Validate deployment
      run: |
        echo "Validating deployment..."
        # Check if table exists
        sudo mysql -u test_user -ptest_password project_db -e "SHOW TABLES LIKE 'ClimateData';"
        
        # Check if humidity column exists
        sudo mysql -u test_user -ptest_password project_db -e "SHOW COLUMNS FROM ClimateData LIKE 'humidity';"
        
        # Check sample data
        sudo mysql -u test_user -ptest_password project_db -e "SELECT COUNT(*) FROM ClimateData;"
        
        # Check indexes
        sudo mysql -u test_user -ptest_password project_db -e "SHOW INDEX FROM ClimateData;"
    
    - name: Run performance monitoring
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: project_db
        CI: true
        GITHUB_ACTIONS: true
      run: |
        echo "Running performance monitoring..."
        python scripts/monitor_performance.py &
        sleep 5
        pkill -f monitor_performance.py || true 