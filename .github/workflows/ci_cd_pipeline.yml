name: Database CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mysql-connector-python python-dotenv
    
    - name: Set up MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client mysql-server
        sudo service mysql start
        sudo mysql -e "CREATE USER 'test_user'@'localhost' IDENTIFIED BY 'test_password';"
        sudo mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'localhost';"
        sudo mysql -e "FLUSH PRIVILEGES;"
    
    - name: Create database
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
      run: |
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS project_db;"
    
    - name: Deploy initial schema
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
      run: |
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db < sql/01_initial_schema.sql
    
    - name: Deploy schema update
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
      run: |
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db < sql/02_schema_update.sql
    
    - name: Seed sample data
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
      run: |
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db < sql/03_sample_data.sql
    
    - name: Run concurrent queries
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: project_db
      run: |
        python scripts/multi_thread_queries.py
    
    - name: Validate deployment
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
      run: |
        # Check if table exists
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db -e "SHOW TABLES LIKE 'ClimateData';"
        
        # Check if humidity column exists
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db -e "SHOW COLUMNS FROM ClimateData LIKE 'humidity';"
        
        # Check sample data
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db -e "SELECT COUNT(*) FROM ClimateData;"
        
        # Check indexes
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD project_db -e "SHOW INDEX FROM ClimateData;"
    
    - name: Run performance monitoring
      env:
        DB_HOST: localhost
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: project_db
      run: |
        python scripts/monitor_performance.py &
        sleep 60
        pkill -f monitor_performance.py 