name: Database CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Use GitHub's MySQL service that comes pre-configured
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: project_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mysql-connector-python python-dotenv psutil pandas matplotlib requests
    
    - name: Verify MySQL connection
      run: |
        echo "Verifying MySQL connection..."
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"
    
    - name: Set up database user
      run: |
        echo "Setting up test user..."
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE USER IF NOT EXISTS 'test_user'@'%' IDENTIFIED BY 'test_password';"
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'test_user'@'%';"
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "FLUSH PRIVILEGES;"
        
        # Verify user creation
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT User, Host FROM mysql.user WHERE User='test_user';"
    
    - name: Deploy initial schema
      run: |
        echo "Deploying initial schema..."
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db < sql/01_initial_schema.sql
    
    - name: Deploy schema update
      run: |
        echo "Updating schema..."
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db < sql/02_schema_update.sql
    
    - name: Seed sample data
      run: |
        echo "Seeding data..."
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db < sql/03_sample_data.sql
    
    - name: Run concurrent queries
      env:
        DB_HOST: 127.0.0.1
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: project_db
        CI: true
        GITHUB_ACTIONS: true
      run: |
        echo "Running concurrent queries..."
        python scripts/multi_thread_queries.py
    
    - name: Validate deployment
      run: |
        echo "Validating deployment..."
        # Check if table exists
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db -e "SHOW TABLES LIKE 'ClimateData';"
        
        # Check if humidity column exists
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db -e "SHOW COLUMNS FROM ClimateData LIKE 'humidity';"
        
        # Check sample data
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db -e "SELECT COUNT(*) FROM ClimateData;"
        
        # Check indexes
        mysql -h 127.0.0.1 -P 3306 -u root -proot project_db -e "SHOW INDEX FROM ClimateData;"
    
    - name: Run performance monitoring
      env:
        DB_HOST: 127.0.0.1
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: project_db
        CI: true
        GITHUB_ACTIONS: true
      run: |
        echo "Running performance monitoring..."
        python scripts/monitor_performance.py &
        sleep 5
        pkill -f monitor_performance.py || true 